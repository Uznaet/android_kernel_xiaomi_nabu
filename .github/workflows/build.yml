
name: Build Xiaomi Pad 5 KernelSU-Next

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make bc bison flex \
            build-essential libssl-dev libelf-dev \
            clang-14 lld-14 \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            python3 python-is-python3 \
            cpio rsync gzip patch

      - name: Verify source files
        run: |
          test -f build.sh
          test -f manual-hooks.patch
          test -f kernel.config

      - name: Build kernel
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify kernel configuration
        run: |
          test -s Image.gz
          gzip -t Image.gz
          ls -lh Image.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nabu-kernelsu-next
          path: |
            Image.gz
            KernelSU-Next-manager-v3.1.0.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Xiaomi Pad 5 KernelSU-Next ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            Image.gz
            KernelSU-Next-manager-v3.1.0.apk
          fail_on_unmatched_files: true
